# ============================================================
#                    MyFaq - Configuracao
#                    Criado por zhendersonz
# ============================================================

# Tempo que o plugin espera pra responder de novo pro mesmo jogador (segundos)
cooldown-por-jogador: 30

# Cooldown global (segundos) - se alguem ativou uma FAQ, ninguem recebe resposta por Xs
cooldown-global: 10

# Delay entre respostas quando uma mensagem ativa varias FAQs (ms)
delay-entre-faqs: 500

# Sensibilidade do matching inteligente (0.0 a 1.0)
# 1.0 = exato, 0.7 = permite pequenas variacoes como "comprar" e "comprá"
sensibilidade: 0.8

# OP comeca com FAQ ativo automaticamente
op-faq-ativo: true

# Palavras que NAO ativam FAQs (evita loop)
anti-loop:
  - "obrigado"
  - "valeu"
  - "brigado"
  - "vlw"
  - "obg"
  - "thx"
  - "thanks"
  - "ok"
  - "okay"

# Mensagens de boas-vindas para novos jogadores (na primeira vez que entram)
# Use %player% para o nome do jogador
boas-vindas:
  - "§e§lBem-vindo(a) ao servidor, %player%!"
  - "§aUse §e/faq §apara ver perguntas frequentes"
  - "§aDivirta-se e respeite as regras!"

# Log de ativacoes (salva em arquivo)
log-ativacoes: true
log-arquivo: "faq-log.txt"
log-formato: "[%data% %hora%] %player% acionou '%faq-id%' com a mensagem: '%mensagem%'"

# Limpeza automatica do log (dias) - 0 ou vazio para desativar
limpar-log-dias: 3

# Prefixo usado nas mensagens do plugin
prefixo: "§7[§aMyFaq§7]§r"

# Notificar staff quando alguem ativar FAQ
notificar-staff: true
notificar-staff-msg: "§7[§aFAQ§7] §f%player% §7perguntou: §f%mensagem%"

# ============================================================
#                     PERGUNTAS FREQUENTES
# ============================================================
#
# Configuracao de cada FAQ:
#
#   palavras:         Palavras-chave para detectar a pergunta
#   regex:            (opicional) Padrao regex avancado
#   respostas:        Lista de respostas (escolhe uma aleatoria)
#   comando:          (opicional) Comando rodado ao ativar
#   tipo-resposta:    mensagem / chat / title
#   permissao:        (opicional) So responde se tiver a permissao
#   permissao-negada: (opicional) Msg pra quem nao tem permissao
#   mensagem-clicavel:
#     texto:          Texto clicavel
#     comando:        Comando ao clicar (usar OU url, nao ambos)
#     url:            Link para abrir ao clicar (usar OU comando, nao ambos)
#   som:              (opicional) Som ao receber (ex: BLOCK_NOTE_BLOCK_PLING)
#   evento-inicio:    (opicional) Timestamp inicio (0 = sempre ativo)
#   evento-fim:       (opicional) Timestamp fim (0 = sempre ativo)

